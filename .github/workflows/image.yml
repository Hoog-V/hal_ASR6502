name: image

# Rebuild and push the CI base image. Only runs on manual dispatch or when the
# files that actually define the image change - the Dockerfile, the build
# script, the module pins, or the SDK channels - not on unrelated edits to this
# workflow. The regular build workflow just pulls the result.
on:
  workflow_dispatch:
  push:
    paths:
      - ci/Dockerfile
      - ci/build-image.sh
      - west.yml
      - .workshop/ci.yaml

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: hal_ASR6502

      - name: Install LXD and Workshop
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          sudo lxd waitready
          # Docker on the runner sets FORWARD to DROP; LXD containers need it.
          sudo iptables -P FORWARD ACCEPT
          sudo snap install workshop --classic
          sudo usermod -aG lxd "$USER"

      - name: Stage workshop project
        run: cp -r hal_ASR6502/.workshop .workshop

      - name: Launch workshop
        run: sg lxd -c 'workshop launch ci'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sg lxd -c "IMAGE=ghcr.io/$owner/hal_asr6502-ci:latest PUSH=1 hal_ASR6502/ci/build-image.sh"

      - name: Prune old image versions (keep 3)
        uses: actions/delete-package-versions@v5
        with:
          package-name: hal_asr6502-ci
          package-type: container
          min-versions-to-keep: 3
