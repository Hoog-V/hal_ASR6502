name: build

on:
  push:
  pull_request:

jobs:
  lht52:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hoog-v/hal_asr6502-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build LHT52 driver image
        run: |
          # The image bakes the Zephyr workspace at /workspace; drop this repo
          # in as the manifest self project and build.
          mkdir -p /workspace/hal_ASR6502
          cp -a "$GITHUB_WORKSPACE/." /workspace/hal_ASR6502/
          cd /workspace
          west build -b lht52 hal_ASR6502/tests/build
