description: |
  ASR6502 watchdog-based counter. A free-running 16-bit ILO counter whose match
  interrupt can wake the SoC from deep sleep. Enabling it disables the watchdog
  reset function.

compatible: "asr,asr6502-counter"

include: [base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true
