description: ASR6502 GPIO port

compatible: "asr,asr6502-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  ngpios:
    const: 8

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
