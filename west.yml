# West manifest for standalone CI builds.
#
# Pulls Canonical's pinned Zephyr 26.10 (upstream 4.5) plus only the three
# modules an LHT52 image actually links against (confirmed by building
# tests/build against exactly this set). hal_ASR6502 is the self/manifest
# project, so its board, SoC and drivers land on the Zephyr module path.
manifest:
  self:
    path: hal_ASR6502

  remotes:
    - name: lp
      url-base: https://git.launchpad.net/~arctic-tern/zephyr-rtos/+git

  defaults:
    remote: lp

  projects:
    - name: zephyr
      revision: 41d10b59730406bbab4ca9f1fbbe9e96aafb4966
      path: zephyr
      west-commands: scripts/west-commands.yml
    - name: cmsis_6
      revision: 1c1840af7a7e757d6e2fec3ddb0e5ce0dfcc93c8
      path: modules/hal/cmsis_6
    - name: picolibc
      revision: 01254932e8e81085817ed61fd858648584ffe37c
      path: modules/lib/picolibc
    - name: segger
      revision: 50892fdbcf2f570e67baa72b8894a66b16946f72
      path: modules/debug/segger
